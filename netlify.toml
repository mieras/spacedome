[build]
  command = "npm run build"
  publish = "dist"
  # Alleen docs of README/CHANGELOG e.d. in de root gewijzigd? (content-.md in src/ telt wél) Dan geen build (scheelt credits).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)docs' ':(exclude,glob)*.md'"

[build.environment]
  NODE_VERSION = "22.23.5"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
